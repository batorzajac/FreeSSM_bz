name: Build and Release FreeSSM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt 5.15.2 & MinGW 8.1.0 (32-bit)
        run: |
          python -m aqt install-qt windows desktop 5.15.2 win32_mingw81 -O C:\Qt
          python -m aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt

      - name: Build & Install FreeSSM
        shell: powershell
        run: |
          .\install.ps1 -Clean -NoShortcuts -InstallDir "C:\FreeSSM" -QtPath "C:\Qt\5.15.2\mingw81_32\bin" -MinGWPath "C:\Qt\Tools\mingw810_32\bin" -DebugMode

      - name: Package Portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path C:\FreeSSM\* -DestinationPath dist\FreeSSM-v1.3.0-portable.zip -Force

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc /DSourceDir="C:\FreeSSM" installer.iss

      - name: Set Release Tag
        id: vars
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or $tag -eq "master" -or $tag -eq "main") {
            $tag = "v1.3.0"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FreeSSM ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
          body: |
            ## FreeSSM ${{ env.RELEASE_TAG }} - Windows

            Oficjalne wydanie programu FreeSSM dla systemu Windows.

            ### Pliki do pobrania:
            * **`FreeSSM-v1.3.0-Setup.exe`** - Pełny instalator Windows (tworzy skróty, deinstalator, instaluje biblioteki runtime).
            * **`FreeSSM-v1.3.0-portable.zip`** - Wersja przenośna (wystarczy rozpakować i uruchomić `FreeSSM.exe`).

            ### Wymagania:
            * Windows 7, 8, 10 lub 11 (32-bit lub 64-bit).
            * Interfejs diagnostyczny Subaru: kabel USB OBD-II K-Line (np. VAG-COM KKL na chipie FTDI FT232) lub kompatybilny interfejs J2534 Pass-Thru (np. Tactrix OpenPort 2.0).
